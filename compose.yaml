services:
  web:
    build: .
    image: familyplanner-web
    restart: unless-stopped
    environment:
      FAMILYPLANNER_DATABASE_URL: postgres://familyplanner:${DB_PASSWORD}@db:5432/familyplanner
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 320M
          cpus: "1.0"
    # Kein Host-Port: Zugriff ausschließlich über Tailscale Serve
    # (Reverse-Proxy auf dem NAS).

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: familyplanner
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: familyplanner
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U familyplanner"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
    # Kein published Port (NFR-001: DB-Port bleibt intern).

  migrate:
    build: .
    image: familyplanner-web
    restart: "no"
    command: ["node", "scripts/migrate.mjs"]
    environment:
      FAMILYPLANNER_DATABASE_URL: postgres://familyplanner:${DB_PASSWORD}@db:5432/familyplanner
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
